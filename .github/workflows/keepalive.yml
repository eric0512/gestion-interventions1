name: Supabase Keep-Alive Cron

on:
  schedule:
    # Exécution tous les 3 jours à 06:00 UTC
    - cron: '0 6 */3 * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase REST API
        env:
          SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
        run: |
          if [ -n "$SUPABASE_URL" ] && [ -n "$SUPABASE_ANON_KEY" ]; then
            echo "Envoi de la requête Keep-Alive vers Supabase..."
            curl -s -f -X GET "$SUPABASE_URL/rest/v1/interventions?select=id&limit=1" \
              -H "apikey: $SUPABASE_ANON_KEY" \
              -H "Authorization: Bearer $SUPABASE_ANON_KEY" \
              && echo "\nSupabase est actif !"
          else
            echo "Les secrets VITE_SUPABASE_URL / VITE_SUPABASE_ANON_KEY ne sont pas définis dans GitHub Secrets."
            echo "Vous pouvez aussi utiliser un service comme cron-job.org pour interroger votre URL Vercel /api/keepalive."
          fi
